<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Style Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Add / Join Server Modal -->
  <div class="modal hidden" id="server-modal">
    <div class="modal-card">
      <button class="modal-close-btn" id="close-server-modal" aria-label="Close">&times;</button>
      
      <div class="modal-header">
        <h2 class="modal-title">Create or Join a Server</h2>
        <p class="modal-subtitle">Your server is where you and your friends hang out. Make yours and start talking.</p>
        
        <div class="modal-tabs">
          <button class="modal-tab active" data-mtab="create">Create Server</button>
          <button class="modal-tab" data-mtab="join">Join with Code</button>
        </div>
      </div>

      <div class="modal-body">
        <!-- Create Form -->
        <form id="create-server-form" class="modal-form">
          <div class="form-group">
            <label for="new-server-name">SERVER NAME</label>
            <input type="text" id="new-server-name" placeholder="My awesome server" required maxlength="30" />
          </div>

          <div class="form-group">
            <label class="checkbox-row">
              <input type="checkbox" id="new-server-community" />
              <span class="checkbox-custom"></span>
              <span class="checkbox-label">Community server <small>(adds #announcements & #rules)</small></span>
            </label>
          </div>

          <p class="modal-error" id="server-modal-error"></p>

          <div class="modal-footer">
            <button type="submit" class="btn-primary btn-brand">Create Server</button>
          </div>
        </form>

        <!-- Join Form -->
        <form id="join-server-form" class="modal-form hidden">
          <div class="form-group">
            <label for="join-code">INVITE CODE OR LINK</label>
            <input type="text" id="join-code" placeholder="e.g. hTK29v" required maxlength="8" />
          </div>

          <p class="modal-error" id="server-modal-error-join"></p>

          <div class="modal-footer">
            <button type="submit" class="btn-primary btn-brand">Join Server</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- New DM Modal -->
  <div class="modal hidden" id="dm-modal">
    <div class="modal-card">
      <button class="modal-close-btn" id="close-dm-modal" aria-label="Close">&times;</button>

      <div class="modal-header">
        <h2 class="modal-title">Select Friend</h2>
        <p class="modal-subtitle">You can add more friends to this direct message.</p>
      </div>

      <div class="modal-body">
        <form id="new-dm-form" class="modal-form">
          <div class="form-group">
            <label for="dm-target-name">USERNAME / DISPLAY NAME</label>
            <input type="text" id="dm-target-name" placeholder="Enter a display name" required />
          </div>

          <p class="modal-error" id="dm-modal-error"></p>

          <div class="modal-footer">
            <button type="submit" class="btn-primary btn-brand">Start Conversation</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Theme / Appearance Modal -->
  <div class="modal hidden" id="theme-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Appearance Settings</h2>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label>THEME PREFERENCE</label>
          <div class="theme-toggle-row">
            <button class="theme-option active" id="theme-dark" data-mode="dark">
              <span class="theme-preview dark"></span>
              Dark
            </button>
            <button class="theme-option" id="theme-light" data-mode="light">
              <span class="theme-preview light"></span>
              Light
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="accent-picker">ACCENT COLOR</label>
          <div class="color-picker-wrapper">
            <input type="color" id="accent-picker" value="#3AA6A0" />
            <span>Select custom brand color</span>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-primary btn-brand" id="close-theme-modal">Done</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="invite-toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
